<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalcraft Farm Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%230f111a' stroke='%23818cf8' stroke-width='8'/><path d='M50 10A40 40 0 0 1 90 50A40 40 0 0 0 50 10' fill='%23818cf8'/></svg>">
    <style>
        :root {
            --bg-gradient-start: #0f111a;
            --bg-gradient-end: #07080c;
            --panel-bg: rgba(22, 26, 41, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(10, 12, 20, 0.8);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #34d399;
            --accent-orange: #fb923c;
            --accent-red: #ef4444;
            --accent-purple: #818cf8;
            --card-inner-bg: rgba(255, 255, 255, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 60px 20px;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 32px;
            width: 100%;
            max-width: 1240px;
            align-items: start;
        }

        .main-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .stats-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 40px;
        }

        .header {
            margin-bottom: 32px;
            text-align: left;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .panel-section-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .collapsible-panel {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
        }

        .collapsible-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .collapsible-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapsible-arrow {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .collapsible-panel.active .collapsible-arrow {
            transform: rotate(180deg);
        }

        .collapsible-body {
            display: none;
            padding: 0 18px 18px 18px;
            animation: fadeIn 0.2s ease;
        }

        .collapsible-panel.active .collapsible-body {
            display: block;
        }

        .input-block {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .inputs-inline {
            display: grid;
            grid-template-columns: 1.2fr 1fr auto;
            gap: 16px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .action-triggers-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-trigger-action {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-trigger-action:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .btn-trigger-action.active-sold {
            background: rgba(251, 146, 60, 0.1);
            border-color: rgba(251, 146, 60, 0.3);
            color: var(--accent-orange);
        }

        .btn-trigger-action.active-lost {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }

        .dynamic-inputs-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .toggle-input-wrapper {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .toggle-input-wrapper.active {
            display: flex;
        }

        .btn-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            height: 45px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.9; }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-row {
            background: var(--card-inner-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 0.8fr 1.3fr 1.5fr auto;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .history-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: rgba(255,255,255,0.05);
        }
        .history-row.has-profit::before { background: var(--accent-green); }
        .history-row.has-loss::before { background: var(--accent-red); }

        .cell-date {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .cell-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .cell-value {
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .cell-value.green { color: var(--accent-green); }
        .cell-value.red { color: var(--accent-red); }
        
        .sub-details-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 4px;
        }

        .sub-sold {
            font-size: 12px;
            color: var(--accent-orange);
            font-weight: 600;
        }

        .sub-lost {
            font-size: 12px;
            color: var(--accent-red);
            font-weight: 600;
        }

        .sub-over {
            font-size: 12px;
            color: var(--accent-purple);
            font-weight: 600;
        }

        .btn-delete {
            background: none;
            border: none;
            color: rgba(239, 68, 68, 0.4);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.08);
        }

        .stat-card {
            background: var(--card-inner-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
        }

        .stat-card .label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .stat-card.total-earned .value { color: var(--accent-green); }

        .calc-panel {
            background: var(--card-inner-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .calc-results {
            background: rgba(10, 12, 20, 0.5);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .calc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .calc-row .res-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .calc-row .res-val {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .calc-row.highlight {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            margin-top: 2px;
        }

        .calc-row.highlight .res-label {
            color: #fff;
            font-weight: 800;
        }

        .calc-row.highlight .res-val {
            color: var(--accent-green);
            font-size: 15px;
            font-weight: 800;
        }

        .backup-zone {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .backup-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        .backup-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-backup {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-backup:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        #fileInput { display: none; }

        .sync-indicator {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: right;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .dashboard-layout { grid-template-columns: 1fr; }
            .stats-panel { position: static; }
        }

        @media (max-width: 768px) {
            .inputs-inline { grid-template-columns: 1fr; }
            .history-row { grid-template-columns: 1fr; gap: 12px; padding: 18px; }
            .btn-submit { width: 100%; }
            .dynamic-inputs-zone { grid-template-columns: 1fr; }
            body { padding: 20px 12px; }
        }
    </style>
</head>
<body>

<div class="dashboard-layout">
    <div class="main-panel">
        <div class="header">
            <h1>Мониторинг Фарма Сталкрафта</h1>
        </div>

        <div class="input-block">
            <div class="inputs-inline">
                <div class="form-group">
                    <label for="logDate">Дата занесения</label>
                    <input type="date" id="logDate">
                </div>
                
                <div class="form-group">
                    <label for="currentBalance">Баланс на счету</label>
                    <input type="number" id="currentBalance" placeholder="Введите">
                </div>
                
                <button class="btn-submit" id="addDayBtn">Добавить день</button>
            </div>

            <div class="action-triggers-row">
                <button class="btn-trigger-action" id="toggleSoldBtn">+ ПРОДАНО СЕГОДНЯ</button>
                <button class="btn-trigger-action" id="toggleLostBtn">+ УТЕРЯНО / ПОТРАЧЕНО</button>
            </div>

            <div class="dynamic-inputs-zone">
                <div class="toggle-input-wrapper" id="soldWrapper">
                    <div class="form-group">
                        <label for="soldAmount">Продано за сегодня</label>
                        <input type="number" id="soldAmount" value="0" placeholder="Например: 2000000">
                    </div>
                </div>

                <div class="toggle-input-wrapper" id="lostWrapper">
                    <div class="form-group">
                        <label for="lostAmount">Утеряно (бан, крафт, покупки)</label>
                        <input type="number" id="lostAmount" value="0" placeholder="Например: 500000">
                    </div>
                </div>
            </div>
        </div>

        <div class="sync-indicator" id="syncIndicator">Синхронизация...</div>

        <div class="history-list" id="historyContainer"></div>
    </div>

    <div class="stats-panel">
        <div class="panel-section-title">Аналитика и финансовый блок</div>

        <div class="stat-card total-earned">
            <div class="label">Заработано за всё время</div>
            <div class="value" id="statTotalEarned">0</div>
        </div>

        <!-- Калькулятор выплат -->
        <div class="calc-panel">
            <div class="panel-section-title" style="font-size: 13px;">Калькулятор расчёта</div>
            
            <div class="calc-grid">
                <div class="form-group">
                    <label for="calcCredited">Зачислено (грн)</label>
                    <input type="number" id="calcCredited" placeholder="1500" value="1500">
                </div>
                <div class="form-group">
                    <label for="calcPersonal">Личные (грн)</label>
                    <input type="number" id="calcPersonal" placeholder="0" value="0">
                </div>
            </div>

            <div class="calc-results">
                <div class="calc-row">
                    <span class="res-label">Сверх лимита (грн):</span>
                    <span class="res-val" id="resOver" style="color: var(--accent-orange);">0</span>
                </div>
                <div class="calc-row">
                    <span class="res-label">База для 20%:</span>
                    <span class="res-val" id="resBase">0</span>
                </div>
                <div class="calc-row">
                    <span class="res-label">Комиссия (20%):</span>
                    <span class="res-val" id="resFee" style="color: var(--accent-purple);">0</span>
                </div>
                <div class="calc-row">
                    <span class="res-label">Остаток на балансе:</span>
                    <span class="res-val" id="resRemain">0</span>
                </div>
                <div class="calc-row highlight">
                    <span class="res-label">Выплата (Сверх + 20%):</span>
                    <span class="res-val" id="resTotalPay">0</span>
                </div>
            </div>
        </div>

        <!-- Компактная настройка лимита -->
        <div class="collapsible-panel" id="limitPanel">
            <div class="collapsible-header" id="limitToggle">
                <div class="collapsible-title">Лимит накопления</div>
                <div class="collapsible-arrow">▼</div>
            </div>
            <div class="collapsible-body">
                <div class="form-group">
                    <label for="limitAmount">Целевой лимит (руб/игровая валюта)</label>
                    <input type="number" id="limitAmount" placeholder="4500000">
                </div>
            </div>
        </div>

        <!-- Настройки Синхронизации JSONbin.io -->
        <div class="collapsible-panel" id="jsonbinPanel">
            <div class="collapsible-header" id="jsonbinToggle">
                <div class="collapsible-title">Настройки JSONbin.io</div>
                <div class="collapsible-arrow">▼</div>
            </div>
            <div class="collapsible-body">
                <div class="form-group" style="margin-bottom: 10px;">
                    <label for="jsonbinBinId">Bin ID</label>
                    <input type="text" id="jsonbinBinId" placeholder="64x...">
                </div>
                <div class="form-group">
                    <label for="jsonbinApiKey">Master Key / Access Key</label>
                    <input type="password" id="jsonbinApiKey" placeholder="$2b$10$...">
                </div>
            </div>
        </div>

        <div class="backup-zone">
            <div class="backup-title">Резервное копирование</div>
            <div class="backup-buttons">
                <button class="btn-backup" id="exportBtn">Экспорт</button>
                <button class="btn-backup" id="importBtn">Импорт</button>
                <input type="file" id="fileInput" accept=".json">
            </div>
        </div>
    </div>
</div>

<script>
    const logDateInput = document.getElementById('logDate');
    const currentBalanceInput = document.getElementById('currentBalance');
    const soldAmountInput = document.getElementById('soldAmount');
    const lostAmountInput = document.getElementById('lostAmount');
    const addDayBtn = document.getElementById('addDayBtn');
    
    const toggleSoldBtn = document.getElementById('toggleSoldBtn');
    const toggleLostBtn = document.getElementById('toggleLostBtn');
    const soldWrapper = document.getElementById('soldWrapper');
    const lostWrapper = document.getElementById('lostWrapper');
    
    const historyContainer = document.getElementById('historyContainer');
    const syncIndicator = document.getElementById('syncIndicator');

    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const fileInput = document.getElementById('fileInput');

    const statTotalEarned = document.getElementById('statTotalEarned');

    // Настройка лимита
    const limitPanel = document.getElementById('limitPanel');
    const limitToggle = document.getElementById('limitToggle');
    const limitAmountInput = document.getElementById('limitAmount');

    // JSONbin Настройки
    const jsonbinPanel = document.getElementById('jsonbinPanel');
    const jsonbinToggle = document.getElementById('jsonbinToggle');
    const jsonbinBinIdInput = document.getElementById('jsonbinBinId');
    const jsonbinApiKeyInput = document.getElementById('jsonbinApiKey');

    // Калькулятор
    const calcCreditedInput = document.getElementById('calcCredited');
    const calcPersonalInput = document.getElementById('calcPersonal');
    const resOver = document.getElementById('resOver');
    const resBase = document.getElementById('resBase');
    const resFee = document.getElementById('resFee');
    const resRemain = document.getElementById('resRemain');
    const resTotalPay = document.getElementById('resTotalPay');

    let farmLog = JSON.parse(localStorage.getItem('stalcraftFarmLog')) || [];
    let syncTimeout = null;

    // Лимит накопления по умолчанию
    let targetLimit = parseFloat(localStorage.getItem('stalcraftTargetLimit')) || 4500000;
    limitAmountInput.value = targetLimit;

    limitToggle.addEventListener('click', () => limitPanel.classList.toggle('active'));
    jsonbinToggle.addEventListener('click', () => jsonbinPanel.classList.toggle('active'));

    limitAmountInput.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) || 0;
        targetLimit = val;
        localStorage.setItem('stalcraftTargetLimit', val);
        renderAll();
    });

    // Настройки JSONbin.io
    jsonbinBinIdInput.value = localStorage.getItem('stalcraftJsonbinBinId') || '';
    jsonbinApiKeyInput.value = localStorage.getItem('stalcraftJsonbinApiKey') || '';

    jsonbinBinIdInput.addEventListener('input', (e) => {
        localStorage.setItem('stalcraftJsonbinBinId', e.target.value.trim());
    });
    jsonbinApiKeyInput.addEventListener('input', (e) => {
        localStorage.setItem('stalcraftJsonbinApiKey', e.target.value.trim());
    });

    function formatNumberWithSpaces(num) {
        return Math.round(num).toLocaleString('ru-RU');
    }

    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        logDateInput.value = `${yyyy}-${mm}-${dd}`;
    }

    toggleSoldBtn.addEventListener('click', () => {
        soldWrapper.classList.toggle('active');
        toggleSoldBtn.classList.toggle('active-sold');
        if(!soldWrapper.classList.contains('active')) {
            soldAmountInput.value = '0';
        }
    });

    toggleLostBtn.addEventListener('click', () => {
        lostWrapper.classList.toggle('active');
        toggleLostBtn.classList.toggle('active-lost');
        if(!lostWrapper.classList.contains('active')) {
            lostAmountInput.value = '0';
        }
    });

    // Синхронизация через JSONbin.io
    function triggerSync(data) {
        if (syncTimeout) clearTimeout(syncTimeout);
        
        syncIndicator.style.display = 'block';
        syncIndicator.style.color = 'var(--accent-orange)';
        syncIndicator.textContent = 'Ожидание изменений...';

        syncTimeout = setTimeout(async () => {
            syncIndicator.textContent = 'Синхронизация с JSONbin...';
            const success = await uploadToJsonbin(data);
            if (success) {
                syncIndicator.style.color = 'var(--accent-green)';
                syncIndicator.textContent = 'Синхронизировано!';
                setTimeout(() => { syncIndicator.style.display = 'none'; }, 2000);
            } else {
                syncIndicator.style.color = 'var(--accent-red)';
                syncIndicator.textContent = 'Ошибка синхронизации';
            }
        }, 500); 
    }

    async function uploadToJsonbin(data) {
        const binId = localStorage.getItem('stalcraftJsonbinBinId');
        const apiKey = localStorage.getItem('stalcraftJsonbinApiKey');

        if (!binId || !apiKey) {
            console.log('JSONbin credentials не заданы. Сохранение только локально.');
            return false;
        }

        const url = `https://api.jsonbin.io/v3/b/${binId}`;
        
        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': apiKey,
                    'X-Bin-Versioning': 'false'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                console.log('Данные успешно сохранены в JSONbin.');
                return true;
            } else {
                const errData = await response.json();
                console.error('Ошибка JSONbin API:', errData.message || response.statusText);
                return false;
            }
        } catch (error) {
            console.error('Ошибка сети при отправке на JSONbin:', error);
            return false;
        }
    }

    addDayBtn.addEventListener('click', () => {
        const todayBalance = parseFloat(currentBalanceInput.value);
        const todaySold = parseFloat(soldAmountInput.value) || 0;
        const todayLost = parseFloat(lostAmountInput.value) || 0;
        const selectedDateRaw = logDateInput.value;

        if (!selectedDateRaw) {
            alert('Выбери дату');
            return;
        }
        if (isNaN(todayBalance) || todayBalance < 0) {
            alert('Введи актуальный баланс счета');
            return;
        }

        const [yyyy, mm, dd] = selectedDateRaw.split('-');
        const formattedDate = `${dd}.${mm}`;

        const existingIndex = farmLog.findIndex(item => item.date === formattedDate);
        if (existingIndex !== -1) {
            if(confirm(`Запись за ${formattedDate} уже существует. Перезаписать ее?`)) {
                farmLog.splice(existingIndex, 1);
            } else {
                return;
            }
        }

        farmLog.push({
            date: formattedDate,
            rawDate: selectedDateRaw,
            balance: todayBalance,
            sold: todaySold,
            lost: todayLost,
            earned: 0
        });

        farmLog.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
        recalculateEarnedValues();

        localStorage.setItem('stalcraftFarmLog', JSON.stringify(farmLog));

        currentBalanceInput.value = '';
        soldAmountInput.value = '0';
        lostAmountInput.value = '0';
        
        soldWrapper.classList.remove('active');
        lostWrapper.classList.remove('active');
        toggleSoldBtn.classList.remove('active-sold');
        toggleLostBtn.classList.remove('active-lost');
        
        setDefaultDate();

        renderAll();
        triggerSync(farmLog);
    });

    function recalculateEarnedValues() {
        for (let i = farmLog.length - 1; i >= 0; i--) {
            if (i === farmLog.length - 1) {
                farmLog[i].earned = 0;
            } else {
                const prevDay = farmLog[i + 1];
                const sold = farmLog[i].sold || 0;
                const lost = farmLog[i].lost || 0;
                farmLog[i].earned = (farmLog[i].balance - prevDay.balance) + sold + lost;
            }
        }
    }

    function updateAnalytics() {
        if (farmLog.length < 2) {
            statTotalEarned.textContent = '0';
            return;
        }

        let totalEarned = 0;
        for (let i = 0; i < farmLog.length - 1; i++) {
            totalEarned += farmLog[i].earned;
        }

        statTotalEarned.textContent = formatNumberWithSpaces(totalEarned);
    }

    // Логика Калькулятора
    function updateCalculator() {
        const credited = parseFloat(calcCreditedInput.value) || 0;
        const personal = parseFloat(calcPersonalInput.value) || 0; // Это и есть твои 100% средства (сверх лимита)

        // Чистая база, которая делится на 80% и 20%
        const baseForFee = Math.max(0, credited - personal);
        
        // Твои 20% от базы
        const fee20 = baseForFee * 0.20;
        
        // 80% от базы, которые остаются на балансе/в накоплении
        const remainInAcc = baseForFee * 0.80;
        
        // Твой итоговый вывод: Личные (100%) + Комиссия (20%)
        const totalPayOut = personal + fee20;

        resOver.textContent = formatNumberWithSpaces(personal);
        resBase.textContent = formatNumberWithSpaces(baseForFee);
        resFee.textContent = formatNumberWithSpaces(fee20);
        resRemain.textContent = formatNumberWithSpaces(remainInAcc);
        resTotalPay.textContent = formatNumberWithSpaces(totalPayOut);
    }

    calcCreditedInput.addEventListener('input', updateCalculator);
    calcPersonalInput.addEventListener('input', updateCalculator);

    window.deleteRow = function(index) {
        if(confirm('Удалить эту запись?')) {
            farmLog.splice(index, 1);
            recalculateEarnedValues();
            localStorage.setItem('stalcraftFarmLog', JSON.stringify(farmLog));
            renderAll();
            triggerSync(farmLog);
        }
    }

    exportBtn.addEventListener('click', () => {
        if (farmLog.length === 0) {
            alert('Лог пуст, экспортировать нечего.');
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(farmLog, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "stalcraft_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const parsedData = JSON.parse(event.target.result);
                if (Array.isArray(parsedData)) {
                    if (confirm('Импортируемый файл полностью перезапишет текущую историю в браузере. Продолжить?')) {
                        farmLog = parsedData;
                        localStorage.setItem('stalcraftFarmLog', JSON.stringify(farmLog));
                        renderAll();
                        triggerSync(farmLog);
                    }
                } else {
                    alert('Ошибка: Файл имеет некорректный формат.');
                }
            } catch (err) {
                alert('Не удалось прочитать файл.');
            }
            fileInput.value = '';
        };
        reader.readAsText(file);
    });

    function renderLog() {
        historyContainer.innerHTML = '';
        if (farmLog.length === 0) {
            historyContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:14px; padding:20px;">Лог чист. Занеси баланс, чтобы начать мониторинг.</div>';
            return;
        }

        farmLog.forEach((item, index) => {
            const row = document.createElement('div');
            let statusClass = '';
            let earnedClass = '';
            let sign = '';

            if (index === farmLog.length - 1) {
                earnedClass = '';
                sign = '';
            } else if (item.earned > 0) {
                statusClass = 'has-profit';
                earnedClass = 'green';
                sign = '+';
            } else if (item.earned < 0) {
                statusClass = 'has-loss';
                earnedClass = 'red';
            }

            const sold = item.sold || 0;
            const lost = item.lost || 0;
            const overLimitAmount = (index !== farmLog.length - 1 && item.earned > targetLimit) 
                ? (item.earned - targetLimit) 
                : 0;

            row.className = `history-row ${statusClass}`;
            row.innerHTML = `
                <div class="cell-date">${item.date}</div>
                <div>
                    <div class="cell-label">Заработано фармом</div>
                    <div class="cell-value ${earnedClass}">
                        ${index === farmLog.length - 1 ? '— (База)' : sign + formatNumberWithSpaces(item.earned)}
                    </div>
                </div>
                <div>
                    <div class="cell-label">Баланс на счету</div>
                    <div class="cell-value">${formatNumberWithSpaces(item.balance)}</div>
                    <div class="sub-details-container">
                        ${overLimitAmount > 0 ? `<span class="sub-over">Сверх лимита: +${formatNumberWithSpaces(overLimitAmount)}</span>` : ''}
                        ${sold > 0 ? `<span class="sub-sold">Продано: ${formatNumberWithSpaces(sold)}</span>` : ''}
                        ${lost > 0 ? `<span class="sub-lost">Утеряно: ${formatNumberWithSpaces(lost)}</span>` : ''}
                    </div>
                </div>
                <div>
                    <button class="btn-delete" onclick="deleteRow(${index})">Удалить</button>
                </div>
            `;
            historyContainer.appendChild(row);
        });
    }

    function renderAll() {
        renderLog();
        updateAnalytics();
        updateCalculator();
    }

    setDefaultDate();
    renderAll();
</script>

</body>
</html>
